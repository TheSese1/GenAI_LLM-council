[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-council"
version = "0.1.0"
description = "Your LLM Council"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    # HTTP communication with Ollama + other nodes
    "requests>=2.32.0",
    # Async support (if you parallelize council calls)
    "httpx>=0.27.0",
    # Logging / structured output (optional but recommended)
    "rich>=13.7.0",
]

[project.scripts]
llm-council = "backend.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]